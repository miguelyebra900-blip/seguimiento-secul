<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Portal Cultural</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skycustom: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Fondo con degradado suave en tonos azul cielo */
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
        }
        /* Animación suave para la tarjeta de login */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        /* Transición suave para el mensaje motivacional */
        .toast-msg {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Componente de Mensajes Motivacionales en la esquina superior izquierda -->
    <div id="motivationalToast" class="fixed top-6 left-6 z-50 max-w-sm glass-card p-4 rounded-2xl shadow-xl border border-white/80 flex items-center space-x-3 toast-msg opacity-0 -translate-y-2 pointer-events-none">
        <div class="w-10 h-10 rounded-full bg-skycustom-500 text-white flex items-center justify-center font-bold text-lg shadow-md shrink-0">
            <i class="fa-solid fa-users text-sm"></i>
        </div>
        <div>
            <p id="motivationalText" class="text-xs font-semibold text-gray-800 leading-snug"></p>
        </div>
    </div>

    <div class="absolute top-10 left-10 text-skycustom-300 opacity-40 text-6xl pointer-events-none transform -rotate-12">
        <i class="fa-solid fa-masks-theater"></i>
    </div>
    <div class="absolute bottom-12 left-16 text-skycustom-300 opacity-40 text-6xl pointer-events-none transform rotate-12">
        <i class="fa-solid fa-palette"></i>
    </div>
    <div class="absolute top-16 right-16 text-skycustom-300 opacity-40 text-6xl pointer-events-none transform rotate-45">
        <i class="fa-solid fa-music"></i>
    </div>
    <div class="absolute bottom-10 right-10 text-skycustom-300 opacity-40 text-6xl pointer-events-none transform -rotate-6">
        <i class="fa-solid fa-person-dancing"></i>
    </div>

    <div class="w-full max-w-md glass-card rounded-3xl shadow-2xl p-8 z-10 relative">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-skycustom-100 text-skycustom-600 mb-3 shadow-inner font-extrabold text-2xl tracking-tighter">
                SeCu
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-wide">Portal Seguimiento</h1>
            <p class="text-xs text-skycustom-600 font-medium tracking-widest uppercase mt-1">
                <i class="fa-solid fa-pen-nib mr-1"></i> Administración &bull; Finanzas &bull; Estrategia
            </p>
        </div>

        <div id="errorMessage" class="hidden mb-4 p-3 rounded-xl bg-red-100 border border-red-200 text-red-700 text-sm text-center">
            Credenciales incorrectas. Por favor, verifica tus datos.
        </div>

        <form id="loginForm" onsubmit="validarAcceso(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1 tracking-wider">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-skycustom-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Ingresa tu usuario"
                        class="w-full pl-10 pr-4 py-3 bg-white/80 border border-skycustom-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-skycustom-400 text-gray-700 text-sm transition-all duration-200 placeholder-gray-400">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1 tracking-wider">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-skycustom-500">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 bg-white/80 border border-skycustom-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-skycustom-400 text-gray-700 text-sm transition-all duration-200 placeholder-gray-400">
                </div>
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-skycustom-400 to-skycustom-600 hover:from-skycustom-500 hover:to-skycustom-600 text-white font-semibold rounded-xl shadow-lg shadow-skycustom-300/50 hover:shadow-xl transition duration-300 flex items-center justify-center space-x-2">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-skycustom-100 pt-4">
            <p class="text-xs text-gray-500 flex items-center justify-center space-x-3">
                <span><i class="fa-solid fa-guitar mr-1"></i>Decreto 345</span>
                <span>&bull;</span>
                <span><i class="fa-solid fa-theater-masks mr-1"></i>IEC & Fórum</span>
                <span>&bull;</span>
                <span><i class="fa-solid fa-paintbrush mr-1"></i>Secretaría de Cultura</span>
            </p>
        </div>
    </div>

    <script>
        // Mensajes Motivacionales
        const frasesMotivacionales = [
            "¡Juntos alcanzamos la meta!",
            "En equipo los resultados son mejores.",
            "El talento gana juegos, pero el trabajo en equipo gana campeonatos.",
            "Ninguno de nosotros es tan bueno como todos nosotros juntos.",
            "Sumando esfuerzos, multiplicamos logros.",
            "El éxito es el resultado del esfuerzo coordinado de todos.",
            "La fuerza del equipo es cada uno de sus miembros."
        ];

        function mostrarMensajeAleatorio() {
            const toast = document.getElementById('motivationalToast');
            const textElem = document.getElementById('motivationalText');
            
            toast.classList.add('opacity-0', '-translate-y-2');
            
            setTimeout(() => {
                const frase = frasesMotivacionales[Math.floor(Math.random() * frasesMotivacionales.length)];
                textElem.innerText = frase;
                
                toast.classList.remove('opacity-0', '-translate-y-2');
                toast.classList.add('opacity-100', 'translate-y-0');
            }, 500);
        }

        mostrarMensajeAleatorio();
        setInterval(mostrarMensajeAleatorio, 6000);

        // Configuración de Supabase
        const SUPABASE_URL = 'https://ubfjuydblmntbkbzutvl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Fpfii6S04VVIuhWw8ycekw_yQqud-us';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function validarAcceso(event) {
            event.preventDefault();

            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.getElementById('btnSubmit');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span> Verificando...</span>';

            try {
                const { data, error } = await _supabase
                    .from('usuarios_acceso')
                    .select('*')
                    .eq('usuario', userVal)
                    .eq('password', passVal)
                    .single();

                if (error || !data) {
                    errorDiv.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Ingresar al Sistema</span><i class="fa-solid fa-arrow-right text-sm"></i>';
                } else {
                    // REGLAS DE NEGOCIO Y PERMISOS POR ROL / USUARIO
                    let rolStr = (data.rol || '').toLowerCase();
                    let usuarioStr = (data.usuario || '').toLowerCase();

                    let vertientesPermitidas = "IEC"; // Por defecto Vertiente 1

                    // 1. Regla para admin, master_admin, dir_general -> Ambas Vertientes
                    if (usuarioStr === 'admin' || rolStr === 'master_admin' || usuarioStr === 'dir_general' || rolStr === 'admin') {
                        vertientesPermitidas = "AMBAS";
                    } 
                    // 2. Regla para enlace_forum -> Solo Vertiente 2
                    else if (usuarioStr.includes('forum') || usuarioStr === 'enlace_forum') {
                        vertientesPermitidas = "FORUM";
                    } 
                    // 3. Regla para enlace_iec (o enlaces generales) -> Solo Vertiente 1
                    else if (usuarioStr.includes('iec') || usuarioStr === 'enlace_iec' || rolStr === 'enlace') {
                        vertientesPermitidas = "IEC";
                    }

                    // Objeto de sesión del usuario
                    const currentUser = {
                        id: data.id,
                        usuario: data.usuario,
                        nombre: data.nombre,
                        rol: data.rol,
                        area: data.area_adscripcion,
                        vertientesPermitidas: vertientesPermitidas
                    };

                    // Guardamos la sesión en localStorage
                    localStorage.setItem('secul_user', JSON.stringify(currentUser));

                    // Control de flujo según los permisos evaluados
                    if (vertientesPermitidas === "AMBAS") {
                        mostrarSelectorVertientes(currentUser);
                    } else {
                        localStorage.setItem('secul_vertiente_activa', vertientesPermitidas);
                        // Redirige según corresponda a su vertiente fija
                        if (vertientesPermitidas === "FORUM") {
                            window.location.href = '/panel3.html';
                        } else {
                            window.location.href = '/panel2.html';
                        }
                    }
                }
            } catch (err) {
                console.error("Error al autenticar:", err);
                errorDiv.innerText = "Ocurrió un error en la conexión.";
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Ingresar al Sistema</span><i class="fa-solid fa-arrow-right text-sm"></i>';
            }
        }

        // Submenú Selector para roles con acceso a AMBAS vertientes
        function mostrarSelectorVertientes(user) {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = false;
            btn.innerHTML = '<span>Ingresar al Sistema</span><i class="fa-solid fa-arrow-right text-sm"></i>';

            const modalHtml = `
            <div id="modalSelector" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 space-y-5 border border-white">
                    <div class="text-center space-y-1">
                        <span class="px-3 py-1 rounded-full text-[10px] font-extrabold bg-skycustom-100 text-skycustom-600 uppercase tracking-wider">
                            Bienvenido/a, ${user.nombre}
                        </span>
                        <h3 class="text-xl font-bold text-gray-800 mt-2">Seleccione el Módulo de Transición</h3>
                        <p class="text-xs text-gray-500">Decreto 345: Elija la vertiente a administrar.</p>
                    </div>
                    
                    <div class="space-y-3 pt-2">
                        <button onclick="irAVertiente('IEC')" class="w-full p-4 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-2xl text-left transition flex items-center justify-between group">
                            <div>
                                <strong class="block text-gray-900 text-xs font-bold">Opción 1: Instituto Estatal de la Cultura (IEC)</strong>
                                <span class="text-[10px] text-gray-500">Liquidación, bienes muebles y ASEG</span>
                            </div>
                            <i class="fa-solid fa-arrow-right text-sky-500 group-hover:translate-x-1 transition-transform"></i>
                        </button>

                        <button onclick="irAVertiente('FORUM')" class="w-full p-4 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-2xl text-left transition flex items-center justify-between group">
                            <div>
                                <strong class="block text-gray-900 text-xs font-bold">Opción 2: Fórum Cultural Guanajuato</strong>
                                <span class="text-[10px] text-gray-500">Extinción, personal y subrogación</span>
                            </div>
                            <i class="fa-solid fa-arrow-right text-indigo-500 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </div>
            </div>`;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function irAVertiente(vertiente) {
            localStorage.setItem('secul_vertiente_activa', vertiente);
            if (vertiente === 'FORUM') {
                window.location.href = '/panel3.html';
            } else {
                window.location.href = '/panel2.html';
            }
        }
    </script>
</body>
</html>
